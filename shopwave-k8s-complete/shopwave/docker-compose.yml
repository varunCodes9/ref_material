# ================================================================
# docker-compose.yml — Local Development Setup
# ================================================================
# K8s seekhne se pehle local mein test karo!
# Command: docker compose up -d
# ================================================================

version: '3.9'

services:
  # ── Infrastructure ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: shopwave123
      POSTGRES_MULTIPLE_DATABASES: shopwave_users,shopwave_products,shopwave_orders,shopwave_notifications
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init.sh
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopwave"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass shopwave_redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "shopwave_redis", "ping"]
      interval: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      retries: 5

  # ── Application Services ─────────────────────────────────────

  api-gateway:
    build: ./services/api-gateway
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: dev-jwt-secret-change-in-prod
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on: [user-service, product-service, order-service]
    restart: unless-stopped

  user-service:
    build: ./services/user-service
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shopwave_users
      DB_USER: shopwave
      DB_PASSWORD: shopwave123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: shopwave_redis
      JWT_SECRET: dev-jwt-secret-change-in-prod
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  product-service:
    build: ./services/product-service
    environment:
      PORT: 3002
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shopwave_products
      DB_USER: shopwave
      DB_PASSWORD: shopwave123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: shopwave_redis
      CACHE_TTL_SECONDS: 300
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  order-service:
    build: ./services/order-service
    environment:
      PORT: 3003
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shopwave_orders
      DB_USER: shopwave
      DB_PASSWORD: shopwave123
      KAFKA_BROKERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    environment:
      PORT: 3004
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shopwave_notifications
      DB_USER: shopwave
      DB_PASSWORD: shopwave123
      KAFKA_BROKERS: kafka:29092
      SMTP_HOST: smtp.ethereal.email
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
