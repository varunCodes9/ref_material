# ================================================================
# Helm values — ek jagah poora app configure karo
# Override: helm install shopwave . --set apiGateway.replicas=3
# ================================================================
global:
  imageRegistry: "shopwave"
  imageTag: "1.0.0"
  namespace: shopwave
  environment: production

apiGateway:
  replicas: 2
  image: api-gateway
  port: 3000
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits:   { memory: "256Mi", cpu: "300m" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 60

userService:
  replicas: 2
  image: user-service
  port: 3001
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits:   { memory: "512Mi", cpu: "500m" }

productService:
  replicas: 2
  image: product-service
  port: 3002
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits:   { memory: "512Mi", cpu: "500m" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8

orderService:
  replicas: 2
  image: order-service
  port: 3003
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits:   { memory: "512Mi", cpu: "500m" }

notificationService:
  replicas: 1
  image: notification-service
  port: 3004
  resources:
    requests: { memory: "128Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "200m" }

postgres:
  image: postgres:16-alpine
  storage: 10Gi
  storageClass: standard

redis:
  image: redis:7-alpine
  storage: 2Gi
  storageClass: standard

kafka:
  image: confluentinc/cp-kafka:7.5.0
  storage: 5Gi
  storageClass: standard

ingress:
  enabled: true
  host: api.shopwave.com
  tlsEnabled: true

monitoring:
  enabled: true
