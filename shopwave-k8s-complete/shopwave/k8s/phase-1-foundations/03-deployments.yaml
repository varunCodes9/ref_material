# ── Notification Service Deployment ───────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: shopwave
  labels:
    app.kubernetes.io/component: notification-service
spec:
  replicas: 1   # Notification service stateless nahi — 1 consumer group ke liye 1 replica
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/component: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3004"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: notification-service
        image: shopwave/notification-service:1.0.0
        ports:
        - name: http
          containerPort: 3004
        env:
        - name: PORT
          value: "3004"
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef: { name: shopwave-config, key: DB_HOST }
        - name: DB_PORT
          valueFrom:
            configMapKeyRef: { name: shopwave-config, key: DB_PORT }
        - name: DB_NAME
          value: "shopwave_notifications"
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: shopwave-db-secret, key: DB_USER }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: shopwave-db-secret, key: DB_PASSWORD }
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef: { name: shopwave-config, key: KAFKA_BROKERS }
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef: { name: shopwave-config, key: SMTP_HOST }
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits:   { memory: "256Mi", cpu: "200m" }
        livenessProbe:
          httpGet: { path: /health/live, port: 3004 }
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet: { path: /health/ready, port: 3004 }
          initialDelaySeconds: 20
          periodSeconds: 10
      terminationGracePeriodSeconds: 30
