# ================================================================
# PHASE 1 — STEP 4: Services
# ================================================================
# PROBLEM WITHOUT SERVICE:
#   Pod ka IP hamesha badalta hai — crash hua, naya IP.
#   order-service ko product-service ka IP kaise pata chalega?
#
# SERVICE KA KAAM:
#   Ek stable DNS naam deta hai: "product-service.shopwave.svc.cluster.local"
#   3 pods hain product-service ke? Service automatically load balance karta hai.
#   Pod restart hua, IP badla — Service ko fark nahi padta, woh labels track karta hai.
#
# VERIFY:
#   kubectl get svc -n shopwave
#   kubectl describe svc api-gateway -n shopwave
# ================================================================

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopwave
  labels:
    app.kubernetes.io/component: api-gateway
spec:
  type: ClusterIP   # Sirf cluster ke andar accessible (Ingress bahar se laayega)
  selector:
    app: api-gateway  # In labels wale pods ko traffic bhejo
  ports:
  - name: http
    port: 80           # Service is port pe sunta hai
    targetPort: http   # Pod ke "http" named port pe forward karo (3000)
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shopwave
  labels:
    app.kubernetes.io/component: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
  - name: http
    port: 3001
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shopwave
  labels:
    app.kubernetes.io/component: product-service
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
  - name: http
    port: 3002
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shopwave
  labels:
    app.kubernetes.io/component: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
  - name: http
    port: 3003
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: shopwave
  labels:
    app.kubernetes.io/component: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
  - name: http
    port: 3004
    targetPort: http
