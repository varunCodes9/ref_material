# ================================================================
# PHASE 2 — ConfigMap
# ================================================================
# PROBLEM: Agar env vars image mein hardcode karo:
#   - Dev mein: DB_HOST=localhost
#   - Prod mein: DB_HOST=postgres-service
#   Matlab har environment ke liye alag image — nightmare!
#
# SOLUTION: ConfigMap mein config, same image everywhere.
#
# APPLY:  kubectl apply -f 01-configmap.yaml -n shopwave
# VERIFY: kubectl describe configmap shopwave-config -n shopwave
#
# BREAK IT (Phase 2 exercise):
#   kubectl edit configmap shopwave-config -n shopwave
#   DB_HOST ko "wrong-host" kar do
#   kubectl rollout restart deployment/user-service -n shopwave
#   kubectl logs deployment/user-service -n shopwave  ← connection error!
#   Fix: DB_HOST wapas sahi karo + rollout restart
# ================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: shopwave-config
  namespace: shopwave
  labels:
    app.kubernetes.io/name: shopwave
    app.kubernetes.io/component: config

data:
  # ── Application ───────────────────────────────────────────
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  APP_VERSION: "1.0.0"

  # ── Database (non-sensitive) ──────────────────────────────
  # K8s Service DNS naam — same namespace mein short naam kaam karta hai
  # Full form: postgres-service.shopwave.svc.cluster.local
  DB_HOST: "postgres-service"
  DB_PORT: "5432"

  # ── Redis ─────────────────────────────────────────────────
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  CACHE_TTL_SECONDS: "300"

  # ── Kafka ─────────────────────────────────────────────────
  KAFKA_BROKERS: "kafka-service:9092"

  # ── Internal Service URLs ─────────────────────────────────
  # Yeh K8s Service names hain — Pods in names se ek doosre ko find karte hain
  USER_SERVICE_URL: "http://user-service:3001"
  PRODUCT_SERVICE_URL: "http://product-service:3002"
  ORDER_SERVICE_URL: "http://order-service:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3004"

  # ── Email ─────────────────────────────────────────────────
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  FROM_EMAIL: "noreply@shopwave.com"
