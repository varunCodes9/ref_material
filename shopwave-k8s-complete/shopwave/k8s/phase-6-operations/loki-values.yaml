# Loki Stack Helm values
loki:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi

promtail:
  enabled: true
  config:
    clients:
    - url: http://loki:3100/loki/api/v1/push

grafana:
  enabled: true
  adminPassword: "shopwave-grafana"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Loki
        type: loki
        url: http://loki:3100
